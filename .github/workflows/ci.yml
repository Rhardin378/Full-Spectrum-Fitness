# CU.2 — See docs/vertical_slices/cleanup_backlog/tickets.md
# Required-check name for RG.1 / CU.6: workflow "CI", job "lint-typecheck-test-build"

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CI: "true"
  # Placeholders only; no live project or secrets. Root layout skips profile bootstrap when CI=true.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-secret

jobs:
  lint-typecheck-test-build:
    name: lint-typecheck-test-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
